<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup - Bubbles Orbitales</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        overflow: hidden;
      }
      .background-grid {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          linear-gradient(rgba(99, 91, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 91, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: 0;
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
        pointer-events: none;
      }
      .orb-1 {
        top: 5%;
        right: 5%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(99, 91, 255, 0.1) 0%,
          transparent 70%
        );
      }
      .orb-2 {
        bottom: 5%;
        left: 5%;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.08) 0%,
          transparent 70%
        );
      }
      .welcome-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 40px;
        /* Dimensions variables pour contrôler la zone orbitale */
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        border: 2px dashed rgba(99, 91, 255, 0.15);
        border-radius: 20px;
      }
      .central-content {
        text-align: center;
        padding: 30px 40px;
        background: rgba(255, 255, 255, 0.95);
        border: 3px solid #635bff;
        border-radius: 20px;
        box-shadow: 0 15px 50px rgba(99, 91, 255, 0.2);
        max-width: 480px;
      }
      .central-content h1 {
        font-size: clamp(20px, 3vw, 30px);
        font-weight: 800;
        color: #1a1a2e;
        margin-bottom: 12px;
      }
      .central-content h1 span {
        color: #635bff;
      }
      .central-content p {
        font-size: clamp(14px, 1.8vw, 18px);
        color: #4b5563;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .cta-container {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .cta-primary {
        background: #635bff;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .cta-primary:hover {
        background: #4f46e5;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 91, 255, 0.35);
      }
      .cta-secondary {
        background: transparent;
        color: #635bff;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        border: 2px solid #635bff;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .cta-secondary:hover {
        background: #635bff;
        color: white;
      }
      .floating-bubbles-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }
      .floating-bubble {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        cursor: pointer;
        gap: 2px;
        pointer-events: auto;
        border: 2px solid;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0.1) 100%
        );
        backdrop-filter: blur(8px);
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .floating-bubble:hover {
        transform: scale(1.5) translateY(-20px);
        z-index: 200;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        border-width: 3px;
      }
      .floating-bubble .icon {
        font-size: 18px;
        transition: transform 0.3s ease;
      }
      .floating-bubble:hover .icon {
        transform: scale(1.3) rotate(15deg);
      }
      .floating-bubble .title {
        font-size: 6px;
        font-weight: 700;
        color: #1a1a2e;
        text-align: center;
        max-width: 50px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      /* Colors */
      .bubble-sensibiliser {
        border-color: rgba(99, 91, 255, 0.5);
        background: linear-gradient(
          135deg,
          rgba(99, 91, 255, 0.25) 0%,
          rgba(99, 91, 255, 0.1) 100%
        );
      }
      .bubble-reseau {
        border-color: rgba(16, 185, 129, 0.5);
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.25) 0%,
          rgba(16, 185, 129, 0.1) 100%
        );
      }
      .bubble-equipe {
        border-color: rgba(139, 92, 246, 0.5);
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.25) 0%,
          rgba(139, 92, 246, 0.1) 100%
        );
      }
      .bubble-activite {
        border-color: rgba(6, 182, 212, 0.5);
        background: linear-gradient(
          135deg,
          rgba(6, 182, 212, 0.25) 0%,
          rgba(6, 182, 212, 0.1) 100%
        );
      }
      .bubble-probleme {
        border-color: rgba(249, 115, 22, 0.5);
        background: linear-gradient(
          135deg,
          rgba(249, 115, 22, 0.25) 0%,
          rgba(249, 115, 22, 0.1) 100%
        );
      }
      .bubble-autrement {
        border-color: rgba(236, 72, 153, 0.5);
        background: linear-gradient(
          135deg,
          rgba(236, 72, 153, 0.25) 0%,
          rgba(236, 72, 153, 0.1) 100%
        );
      }
      .bubble-entreprise {
        border-color: rgba(20, 184, 166, 0.5);
        background: linear-gradient(
          135deg,
          rgba(20, 184, 166, 0.25) 0%,
          rgba(20, 184, 166, 0.1) 100%
        );
      }
      .bubble-certifier {
        border-color: rgba(245, 158, 11, 0.5);
        background: linear-gradient(
          135deg,
          rgba(245, 158, 11, 0.25) 0%,
          rgba(245, 158, 11, 0.1) 100%
        );
      }
      .bubble-financement {
        border-color: rgba(34, 197, 94, 0.5);
        background: linear-gradient(
          135deg,
          rgba(34, 197, 94, 0.25) 0%,
          rgba(34, 197, 94, 0.1) 100%
        );
      }
      .bubble-distribution {
        border-color: rgba(14, 165, 233, 0.5);
        background: linear-gradient(
          135deg,
          rgba(14, 165, 233, 0.25) 0%,
          rgba(14, 165, 233, 0.1) 100%
        );
      }
      .bubble-mentor {
        border-color: rgba(217, 70, 239, 0.5);
        background: linear-gradient(
          135deg,
          rgba(217, 70, 239, 0.25) 0%,
          rgba(217, 70, 239, 0.1) 100%
        );
      }
      .bubble-formation {
        border-color: rgba(99, 102, 241, 0.5);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.25) 0%,
          rgba(99, 102, 241, 0.1) 100%
        );
      }
      .instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(26, 26, 46, 0.9);
        color: white;
        padding: 10px 24px;
        border-radius: 30px;
        font-size: 12px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="background-grid">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>

      <section class="welcome-section">
        <div class="central-content">
          <h1>Bienvenue sur <span>STARTERKIT CM</span></h1>
          <p>Votre plateforme pour développer votre entreprise au Cameroun.</p>
          <div class="cta-container">
            <button class="cta-primary">Découvrir</button>
            <button class="cta-secondary">Parcours</button>
          </div>
        </div>

        <div class="floating-bubbles-container" id="bubblesContainer"></div>
      </section>

      <div class="instructions">
        Bougez la souris pour interagir avec les bubbles
      </div>
    </div>
    <script>
      const bubbles = [
        { id: "sensibiliser", title: "Sensibiliser", icon: "💡" },
        { id: "reseau", title: "Réseau", icon: "👥" },
        { id: "equipe", title: "Équipe", icon: "➕" },
        { id: "activite", title: "Activité", icon: "📈" },
        { id: "probleme", title: "Problème", icon: "⚖️" },
        { id: "autrement", title: "Autrement", icon: "🚀" },
        { id: "entreprise", title: "Entreprise", icon: "🏢" },
        { id: "certifier", title: "Certifier", icon: "📜" },
        { id: "financement", title: "Financement", icon: "💰" },
        { id: "distribution", title: "Distribution", icon: "🚚" },
        { id: "mentor", title: "Mentor", icon: "🎓" },
        { id: "formation", title: "Formation", icon: "📚" },
      ];

      const container = document.getElementById("bubblesContainer");
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      document.addEventListener("mousemove", function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function createBubbles() {
        // Utiliser les dimensions de welcome-section
        const section = document.querySelector(".welcome-section");
        const sectionRect = section.getBoundingClientRect();

        const centerX = sectionRect.width / 2;
        const centerY = sectionRect.height / 2;
        const safeRadius =
          Math.min(sectionRect.width, sectionRect.height) * 0.15;

        bubbles.forEach(function (bubble, index) {
          const el = document.createElement("div");
          el.className = "floating-bubble bubble-" + bubble.id;
          el.innerHTML =
            '<span class="icon">' +
            bubble.icon +
            '</span><span class="title">' +
            bubble.title +
            "</span>";

          const angle = (index / bubbles.length) * Math.PI * 2;
          const orbitRadius = safeRadius + 100 + Math.random() * 150;

          let currentAngle = angle;
          const angleSpeed = 0.0003 + Math.random() * 0.0002;
          const angleDir = Math.random() > 0.5 ? 1 : -1;

          const floatPhase = Math.random() * Math.PI * 2;
          const floatSpeed = 1500 + Math.random() * 1000;

          el.style.left = centerX + Math.cos(angle) * orbitRadius - 30 + "px";
          el.style.top = centerY + Math.sin(angle) * orbitRadius - 30 + "px";

          function animate() {
            const time = Date.now();
            currentAngle += angleSpeed * angleDir;

            const currentOrbitRadius = orbitRadius + Math.sin(time / 2000) * 20;
            const orbitX =
              centerX + Math.cos(currentAngle) * currentOrbitRadius - 30;
            const orbitY =
              centerY + Math.sin(currentAngle) * currentOrbitRadius - 30;

            const floatX = Math.sin(time / floatSpeed + floatPhase) * 8;
            const floatY = Math.cos(time / (floatSpeed * 0.8) + floatPhase) * 6;

            let finalX = orbitX + floatX;
            let finalY = orbitY + floatY;

            // Collision avec zone centrale
            const bubbleCenterX = finalX + 30;
            const bubbleCenterY = finalY + 30;
            const distFromCenter = Math.sqrt(
              Math.pow(bubbleCenterX - centerX, 2) +
                Math.pow(bubbleCenterY - centerY, 2),
            );

            if (distFromCenter < safeRadius) {
              const pushAngle = Math.atan2(
                bubbleCenterY - centerY,
                bubbleCenterX - centerX,
              );
              finalX = centerX + Math.cos(pushAngle) * (safeRadius + 35) - 30;
              finalY = centerY + Math.sin(pushAngle) * (safeRadius + 35) - 30;
            }

            // Collision avec les bords de la section
            const bubbleSize = 35;
            if (finalX < bubbleSize) finalX = bubbleSize;
            if (finalX > sectionRect.width - bubbleSize)
              finalX = sectionRect.width - bubbleSize;
            if (finalY < bubbleSize) finalY = bubbleSize;
            if (finalY > sectionRect.height - bubbleSize)
              finalY = sectionRect.height - bubbleSize;

            // Répulsion souris
            const dx = bubbleCenterX - mouseX;
            const dy = bubbleCenterY - mouseY;
            const distMouse = Math.sqrt(dx * dx + dy * dy);
            const repelRadius = 140;

            if (distMouse < repelRadius && distMouse > 0) {
              const force = Math.pow(
                (repelRadius - distMouse) / repelRadius,
                2,
              );
              finalX += (dx / distMouse) * force * 40;
              finalY += (dy / distMouse) * force * 30;
            }

            const isHovered = el.matches(":hover");
            el.style.transform =
              "translate(" +
              (finalX - parseFloat(el.style.left)) +
              "px, " +
              (finalY - parseFloat(el.style.top)) +
              "px) " +
              "translate(" +
              el.style.left +
              ", " +
              el.style.top +
              ") " +
              "scale(" +
              (isHovered ? 1.5 : 1) +
              ") " +
              "translateY(" +
              (isHovered ? "-20px" : "0") +
              ")";

            el.style.zIndex = isHovered ? 200 : 10;
            requestAnimationFrame(animate);
          }

          animate();
          container.appendChild(el);
        });
      }

      createBubbles();

      window.addEventListener("resize", function () {
        container.innerHTML = "";
        createBubbles();
      });
    </script>
  </body>
</html>
